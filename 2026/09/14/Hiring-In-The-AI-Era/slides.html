---

Goal: 行銷自己
Audience: 面試官及面試者
Purpose: 幫助面試官更好地找人，面試者更知道如何準備

---

以終為始：
- 面試官知道哪裡是新鮮人會有的困難
- 面試者更知道要如何準備
- 反思 AI 的使用

---

## 免責聲明

以下皆為個人經驗分享，不針對任何人士或機構。
如有雷同，實屬巧合。

---

## 面試篇

> 我的經驗
- 第一場面試：手寫 9x9 乘法
- side project: terminal 猜數字、部落格

> AI 時代
- Pre-test: 大家都滿分
- side project: 衣物穿搭的 APP
- 尿遁大法：寫出了自己都不知道的解法（勘久郎）

> 我們面試方向的轉變

- 白板題 -> 用電腦面試（順便考核平常使用 AI 的情況) -> 改回白板題
因為我們更想看到面試者白板上的思考過程，而非黑白分明的解題結果。

- github: 以前很喜歡看，但逐漸失效，現在比較常看 AI 的使用方式

---

## 新人篇

> 我的經驗
- 大家都很忙，最久的工程師只有一年，只能自己摸索
- 沒有文件或者很久沒更新

> AI 時代 (各種 Case Study)
- git branch 的誤用
- 我與 AI 的語音輸入器
- 問題變少了，人人有 AI
- 失去了建立腦中地圖的機會
- 專案結構發展變複雜（牌組強度膨脹）
- domain 都回答的出來，但 codebase 還是很陌生

> 我們比較想要的是什麼
- 會讀 Code !!!
- 文件定期更新(尤其是 code 沒有的資訊)、專案架構圖
- 知道問題是什麼、自己在做什麼
- 利用領域知識，下出更好的 prompt

---

## 真正的風險

四象限：
- Known Knowns
- Known Unknowns
- Unknown Knowns
- Unknown Unknowns

---

## Vibe coding 時代的四種工程師。

1.守舊派：排斥 AI · 堅持手寫 · 崇尚傳統與規範
2.輕度維新派：接受輔助 · 什麼都自己檢查 · 核心仍自己寫
3.半維新派：大量生成 · 自己把關 review · AI 是幫手不是主角
4.維新派：駕馭 AI · 描述意圖 · 專注在架構

---

## 結論

- 通過率真的是因為 AI 而改變的嗎？
- 你的合作對象始終是個人
- 持續學習

  <script>
    document.addEventListener('DOMContentLoaded', function() { 
      Reveal.initialize({
        hash: true, slideNumber: true, transition: 'slide',
        center: true, margin: 0.02, width: 1280, height: 720,
        plugins: [RevealMarkdown, RevealHighlight, RevealNotes],
        highlight: { highlightOnLoad: true, escapeHTML: false },
        markdown: { smartypants: true },
      });
      Reveal.on('ready', function() {
        document.querySelectorAll('pre code').forEach(function(block) {
          block.classList.add('hljs-line-numbers');
          const lines = block.innerHTML.split('\n');
          let numberedCode = '';
          for (let i = 0; i < lines.length; i++) {
            numberedCode += '<span class="line-number">' + (i + 1) + '</span>' + lines[i] + '\n';
          }
          block.innerHTML = numberedCode;
        });
      }); 
    (function() {
      var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxNSsP3uJKQsmFkFY01dfGh0sKGdaMUpOa-_bjNzM9j1oUobMcM89QUTN9ekbe5OfCD/exec";
      var POLL_INTERVAL   = 10000;
      var LANES           = 1;
      var AUTO_PLAY       = false;
      var pendingRows     = new Set();
      var queues          = Array.from({ length: LANES }, function() { return []; });
      var isAnimating     = Array(LANES).fill(false);
      var timers          = Array(LANES).fill(null);
      var timerEndTime    = Array(LANES).fill(null);
      var isPlaying       = AUTO_PLAY;

      // Embed module-level pure functions directly so tests and client share one definition
      function filterUnseenMessages(messages, seen) {
  return messages.filter(function(msg) { return !seen.has(msg.row); });
}
      function formatMessage(msg) {
  return msg.name + '：' + msg.message;
}

      function totalQueued() {
        return queues.reduce(function(sum, q) { return sum + q.length; }, 0);
      }
      function updateIndicator() {
        if (AUTO_PLAY) return;
        var el = document.getElementById('bs-indicator');
        if (!el) return;
        var total = totalQueued();
        el.textContent = total === 0 ? '等待中..' : total + ' 則訊息';
      }

      function poll() {
        fetch(APPS_SCRIPT_URL)
          .then(function(r) { return r.json(); })
          .then(function(messages) {
            if (!Array.isArray(messages)) return;
            var unseen = filterUnseenMessages(messages, pendingRows);
            unseen.forEach(function(msg) {
              pendingRows.add(msg.row);
              var lane = 0;
              for (var i = 1; i < LANES; i++) {
                if (queues[i].length < queues[lane].length) lane = i;
              }
              queues[lane].push(msg);
              if (isPlaying && !isAnimating[lane]) showNext(lane);
            });
            updateIndicator();
          })
          .catch(function() {});
      }

      function showNext(lane) {
        if (!isPlaying) { isAnimating[lane] = false; return; }
        if (queues[lane].length === 0) { isAnimating[lane] = false; updateIndicator(); return; }
        isAnimating[lane] = true;
        var msg = queues[lane].shift();
        updateIndicator();
        var marquee = document.getElementById('chat-marquee-' + lane);
        var inner   = document.getElementById('chat-marquee-inner-' + lane);
        inner.textContent = formatMessage(msg);
        marquee.style.display = 'flex';

        var len = inner.textContent.length;
        var duration = Math.max(6, len * 0.18 + len * len * 0.002);
        inner.style.animationDuration = duration + 's';
        inner.style.animation = 'none';
        inner.offsetHeight;
        inner.style.animation = '';
        inner.style.animationDuration = duration + 's';

        fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'markProcessed', row: msg.row }),
        }).catch(function() {});

        var ms = duration * 1000;
        timerEndTime[lane] = Date.now() + ms;
        timers[lane] = setTimeout(function() {
          timers[lane] = null;
          timerEndTime[lane] = null;
          if (queues[lane].length === 0) marquee.style.display = 'none';
          showNext(lane);
        }, ms);
      }

      function togglePlay() {
        isPlaying = !isPlaying;
        var btn = document.getElementById('bs-play-btn');
        if (btn) btn.textContent = isPlaying ? '⏸' : '▶';
        if (!isPlaying) {
          for (var i = 0; i < LANES; i++) {
            if (timers[i]) { clearTimeout(timers[i]); timers[i] = null; }
            var inner = document.getElementById('chat-marquee-inner-' + i);
            if (inner) inner.style.animationPlayState = 'paused';
          }
        } else {
          for (var i = 0; i < LANES; i++) {
            if (isAnimating[i]) {
              var remaining = timerEndTime[i] ? timerEndTime[i] - Date.now() : 0;
              if (remaining <= 0) {
                isAnimating[i] = false;
                showNext(i);
              } else {
                var inner = document.getElementById('chat-marquee-inner-' + i);
                if (inner) inner.style.animationPlayState = 'running';
                (function(lane, rem) {
                  timers[lane] = setTimeout(function() {
                    timers[lane] = null;
                    timerEndTime[lane] = null;
                    var marquee = document.getElementById('chat-marquee-' + lane);
                    if (queues[lane].length === 0 && marquee) marquee.style.display = 'none';
                    showNext(lane);
                  }, rem);
                })(i, remaining);
              }
            } else if (queues[i].length > 0) {
              showNext(i);
            }
          }
        }
      }

      var btn = document.getElementById('bs-play-btn');
      if (btn) btn.addEventListener('click', togglePlay);

      setInterval(poll, POLL_INTERVAL);
      poll();
    })(); });
  </script>
